name: Diabetes Detection CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/portable-dataset-and-prediction]
  workflow_dispatch:

jobs:
  train-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile diabetes.py
      - name: Run training and sample prediction
        run: python diabetes.py
